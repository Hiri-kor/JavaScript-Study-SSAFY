<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 연습장 | JS 시험 대비 노트</title>
<script>try{var t=localStorage.getItem('jsstudy:theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-root="." data-page="playground">
<header id="site-header"></header>
<main class="pg-wrap">
  <div class="pg-toolbar">
    <button type="button" class="btn btn-primary" id="pg-run">▶ 실행 <kbd>Ctrl+Enter</kbd></button>
    <select id="pg-examples" aria-label="예제"><option value="">불러오는 중…</option></select>
    <label><input type="checkbox" id="pg-auto"> 입력하면 자동 실행</label>
    <label title="로또 예제처럼 lodash(_) 라이브러리가 필요할 때"><input type="checkbox" id="pg-lodash"> lodash 포함</label>
    <span style="flex:1"></span>
    <button type="button" class="btn" id="pg-typing">⌨ 이 코드 따라치기</button>
    <button type="button" class="btn" id="pg-share">🔗 링크 복사</button>
    <button type="button" class="btn btn-ghost" id="pg-reset">비우기</button>
  </div>
  <div class="pg-grid">
    <section class="pg-pane">
      <div class="pg-tabs" role="tablist">
        <button type="button" data-tab="html">HTML<span class="dot" hidden></span></button>
        <button type="button" data-tab="css">CSS<span class="dot" hidden></span></button>
        <button type="button" data-tab="js" class="active">JS<span class="dot" hidden></span></button>
      </div>
      <textarea id="pg-editor" class="code-input pg-editor" aria-label="JS 코드 입력"></textarea>
    </section>
    <section class="pg-pane">
      <div class="pg-tabs"><button type="button" class="active" tabindex="-1">미리보기</button></div>
      <iframe id="pg-preview" class="pg-preview" title="실행 미리보기" sandbox="allow-scripts allow-modals allow-forms"></iframe>
      <div class="pg-console-head"><span>콘솔</span><button type="button" class="btn btn-ghost btn-sm" id="pg-clear-console">지우기</button></div>
      <div id="pg-console" class="console pg-console" aria-live="polite"></div>
    </section>
  </div>
  <p class="small muted"><span class="kbd-hint">Tab = 공백 2칸 · Shift+Tab = 내어쓰기 · </span>입력한 코드는 이 브라우저에 자동 저장됩니다. 코드는 격리된 미리보기 창에서만 실행됩니다.</p>
</main>
<script src="data/topics.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/runner.js"></script>
<script src="assets/js/typing.js"></script>
<script src="assets/js/playground.js"></script>
</body>
</html>
